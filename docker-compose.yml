services:
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: medicare-fuseki
    ports:
      - "3030:3030"
    environment:
      # medicare       : the working dataset (npm run load-ontology)
      # medicare_test  : empty dataset the integration suite clears and refills
      FUSEKI_DATASET_1: medicare
      FUSEKI_DATASET_2: medicare_test
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-medicare}
    volumes:
      # Persist the image's complete writable data directory. Mounting only the
      # databases subfolder prevents the image entrypoint from preparing it.
      - fuseki-data:/fuseki
    restart: unless-stopped

volumes:
  fuseki-data:
