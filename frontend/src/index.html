<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>MedicCare</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MedicCare - medical care platform over an OWL ontology: patients, appointments, tests, knowledge base and a natural language assistant.">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Applied before Angular bootstraps so the first painted frame already has the right theme.
    (function () {
      try {
        var stored = localStorage.getItem('medicare.theme');
        var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var lang = localStorage.getItem('medicare.lang');
        if (lang === 'fr' || lang === 'en') document.documentElement.lang = lang;
      } catch (e) { /* private mode: fall back to the light theme */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
